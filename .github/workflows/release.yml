name: Release

# 打 tag（v*）即自动构建并发布 —— 从流程上消灭 v1.0.9 那种
# "tag 指向的提交 ≠ 版本号提交，结果构建出来版本号对不上" 的事故。
#
# 签名：仓库配了下面 4 个 secret 就出**签名包**，没配就出**未签名包**（构建不会失败）：
#   PICKUP_STORE_BASE64     keystore 文件的 base64（`base64 -w0 pickup.keystore`）
#   PICKUP_STORE_PASSWORD   storePassword
#   PICKUP_KEY_ALIAS        keyAlias
#   PICKUP_KEY_PASSWORD     keyPassword
#
# 注意：tag 必须打在**版本号 bump 的提交**上（见 app/build.gradle.kts 的注释）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # 支持手动试跑（试跑时不会发布，只构建与校验）

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.PICKUP_STORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "已配置签名密钥，将产出**签名包**"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning::未配置签名密钥（PICKUP_STORE_BASE64），本次只出**未签名包**，不会发布 Release"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build release APKs
        env:
          PICKUP_STORE_PASSWORD: ${{ secrets.PICKUP_STORE_PASSWORD }}
          PICKUP_KEY_ALIAS: ${{ secrets.PICKUP_KEY_ALIAS }}
          PICKUP_KEY_PASSWORD: ${{ secrets.PICKUP_KEY_PASSWORD }}
        run: |
          if [ -f release.keystore ]; then
            export PICKUP_STORE_FILE="$GITHUB_WORKSPACE/release.keystore"
          fi
          ./gradlew :app:assembleRelease --console=plain

      # 关键校验：产物版本号必须与 tag 一致，否则直接失败（防止再次出现 tag/产物错位）
      # 注意：无 keystore 时 AGP 的产物名会带 -unsigned 后缀，所以这里用通配匹配，不能写死文件名。
      - name: Verify APK version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -x
          TAG="${GITHUB_REF_NAME#v}"
          AAPT2=$(command -v aapt2 || ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then echo "::error::找不到 aapt2"; ls "${ANDROID_HOME:-}/build-tools" || true; exit 1; fi
          APK=$(ls app/build/outputs/apk/release/app-arm64-v8a-release*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "::error::找不到 APK 产物"; ls -R app/build/outputs/apk/release || true; exit 1; fi
          BADGING=$("$AAPT2" dump badging "$APK")
          VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          echo "tag=$TAG apk=$APK versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          if [ "$TAG" != "$VERSION_NAME" ]; then
            echo "::error::tag($TAG) 与 APK versionName($VERSION_NAME) 不一致 —— tag 是否打在版本号 bump 提交（或其之后）？"
            exit 1
          fi

      # 校验签名（有密钥时）
      - name: Verify signature
        run: |
          APKSIGNER=$(command -v apksigner || ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/app-arm64-v8a-release*.apk | head -1)
          if [ "$SIGNED" = "1" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            echo "未配置密钥，跳过签名校验（产物为 unsigned）"
          fi

      - name: Compute SHA-256
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk | tee "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          {
            echo "## 产物校验"
            echo '```'
            cat "$GITHUB_WORKSPACE/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 只有签名包才发布：未签名 APK 根本无法安装，发出去只会误导用户。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            > 请直接从旧版本升级到本版。若你装的是 v1.0.0–v1.0.2 且中间未更新过，
            > **不要经过 1.0.8 / 1.0.9**（那两个版本对旧数据库会闪退）。

      - name: Skip notice
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED != '1'
        run: |
          echo "::warning::未配置签名密钥，已跳过 Release 发布（未签名 APK 无法安装）。"
          echo "把 keystore 以 base64 存入 secret PICKUP_STORE_BASE64，并配 PICKUP_STORE_PASSWORD / PICKUP_KEY_ALIAS / PICKUP_KEY_PASSWORD 即可自动发布签名包。" >> "$GITHUB_STEP_SUMMARY"
